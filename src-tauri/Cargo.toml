[package]
name = "piuma-launcher"
version = "0.4.0"
description = "Lightweight open source Minecraft launcher"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "piuma_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
flate2 = { version = "1.1.10", features = ["rust_backend"] }
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.153"
sha1 = "0.11.0"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tar = "0.4.46"
tauri = { version = "2", features = [] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time"] }
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
